<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山径 · 阶段 0 原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9ede8;color:#182b25;font-family:system-ui,'Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;min-height:48px;background:#edf1ec;color:#182b25}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7450a2;outline-offset:2px}button:hover{filter:brightness(.96)}.layout{max-width:1080px;margin:40px auto;display:flex;gap:70px;align-items:center;padding:24px}.intro{max-width:360px}.eyebrow{font-size:12px;letter-spacing:3px;color:#17634b;font-weight:700}h1{font-size:44px;font-weight:600;line-height:1.25;letter-spacing:-2px}h2{font-size:24px;margin:0}p{line-height:1.8;color:#5a6860}.pill{display:inline-block;border:1px solid #cbd6cb;border-radius:20px;padding:6px 12px;margin:4px 0;font-size:12px}.phone{width:390px;flex-shrink:0;min-height:770px;background:#f5f6f2;border:8px solid #24392f;border-radius:42px;overflow:hidden;box-shadow:0 24px 60px #182b2520;position:relative}.status{display:flex;justify-content:space-between;padding:14px 22px 6px;font-size:12px;font-weight:600}.top{display:flex;align-items:center;justify-content:space-between;padding:10px 20px}.brand{font-size:23px;font-weight:750}.small{font-size:12px;color:#5a6860}.main{min-height:610px}.map{height:354px;position:relative;background:#e4eadb;overflow:hidden}.map svg{width:100%;height:100%}.map-tag{position:absolute;top:14px;left:16px;border-radius:24px;background:#f5f6f2;padding:9px 12px;font-size:12px}.map-label{position:absolute;bottom:10px;left:12px;font-size:10px;color:#52634e}.locate{position:absolute;right:14px;bottom:18px;background:#f5f6f2;box-shadow:0 3px 14px #182b2515}.sheet{position:relative;border-radius:24px 24px 0 0;background:#f5f6f2;padding:18px 20px 20px;margin-top:-15px}.handle{width:32px;height:4px;background:#d7ddd4;border-radius:3px;margin:0 auto 18px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.metrics{display:flex;gap:20px;margin:12px 0 22px}.metrics>div{flex:1}.value{font-size:26px;font-variant-numeric:tabular-nums;font-weight:650}.hero{font-size:46px;letter-spacing:-2px;line-height:1.25;font-weight:650}.unit{font-size:14px;font-weight:400;letter-spacing:0;color:#5a6860}.primary{background:#17634b;color:#fff;width:100%;font-weight:650}.secondary{width:100%;margin-top:10px}.danger{background:#f6e7df;color:#993f24}.nav{display:flex;border-top:1px solid #e0e5dc;padding:8px 22px;background:#f5f6f2;gap:12px}.nav button{flex:1;background:transparent}.nav .selected{color:#17634b;background:#e3ebdf;font-weight:700}.content{padding:18px 20px}.card{background:#fff;border:1px solid #e1e7dd;border-radius:18px;padding:18px;margin:12px 0;width:100%;text-align:left}.card strong{display:block;margin-bottom:8px;font-size:17px}.tabs{display:flex;gap:6px;margin:16px 0}.tabs button{padding:8px 12px;font-size:13px}.tabs .selected{background:#17634b;color:white}input{width:100%;border:1px solid #ced8cc;background:#fff;padding:14px;border-radius:12px}select{border:0;background:#e7eee3;padding:8px;border-radius:8px}.notice{padding:12px 14px;background:#e6eee0;border-radius:12px;font-size:13px;line-height:1.7;margin:12px 0}.legend{color:#7450a2;font-size:12px}.back{background:transparent;padding:8px}.full{width:100%}.toast{position:absolute;bottom:80px;left:16px;right:16px;background:#24392f;color:#fff;padding:14px;border-radius:14px;font-size:13px;z-index:8}.hidden{display:none}dialog{border:0;border-radius:24px;padding:24px;max-width:330px;box-shadow:0 20px 70px #0003}dialog::backdrop{background:#17282070}dialog h3{margin-top:0}dialog .row button{flex:1}.intro ol{padding-left:20px;color:#5a6860;line-height:2}.mini{height:225px;margin-bottom:18px}.mini svg{height:100%}@media(max-width:760px){.layout{margin:0;flex-direction:column;padding:16px;gap:20px}.intro{max-width:390px}.intro h1{font-size:28px;margin:12px 0}.intro ol{display:none}.phone{width:min(390px,100%);border-width:4px;border-radius:28px}.intro p{margin:8px 0}.main{min-height:590px}}
</style></head><body>
<div class="layout"><aside class="intro"><div class="eyebrow">TRAIL / 山径</div><h1>打开地图，<br>走自己的路。</h1><p>记录眼前的每一步，<br>也把下一条路线带在身边。</p><span class="pill">阶段 0 · 可点击设计原型</span><ol><li>开始记录 → 暂停 → 结束保存</li><li>轨迹 → 示例导入 → 加载到地图</li><li>设置 → 查看最小配置</li></ol><p class="small">所有地图、定位与运动数据均为示意。<br>原型不访问定位或文件，刷新会重置。</p></aside>
<div class="phone"><div class="status"><span>09:41</span><span>● ● ▰</span></div><header class="top" id="header"></header><main class="main" id="screen"></main><nav class="nav" aria-label="主导航"><button id="mapNav">⌖ 地图</button><button id="listNav">≋ 轨迹</button></nav><div id="toast" class="toast hidden" role="status"></div></div></div>
<dialog id="finishDialog"><h3>结束并保存轨迹？</h3><p>已记录 2.48 公里。保存后可在轨迹中查看和导出。</p><div class="row"><button id="cancelFinish">继续查看</button><button id="confirmFinish" class="primary">保存轨迹</button></div></dialog>
<script>
const screen=document.getElementById('screen'),header=document.getElementById('header');
let page='map',recording='idle',reference=false,filter='全部',query='',selected=0,mode='徒步',toastTimer;
let tracks=[{name:'湖边的一圈',distance:'6.32',duration:'01:28:16',ascent:'86',source:'已记录',date:'10 月 07 日 · 徒步'},{name:'山脊步道 · 周末计划',distance:'12.80',duration:'—',ascent:'—',source:'已导入',date:'GPX · 2 个分段'}];
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function mapMarkup(mini=false){return `<div class="map ${mini?'mini':''}"><svg viewBox="0 0 390 354" role="img" aria-label="示意地图，绿色实际轨迹与紫色参考路线"><rect width="390" height="354" fill="#e4eadb"/><g fill="none" stroke="#cbd7bf" stroke-width="1.3"><path d="M-40 80Q100-20 180 85T440 100M-40 100Q100 0 180 105T440 120M-40 120Q100 20 180 125T440 140M-40 140Q100 40 180 145T440 160M-40 160Q100 60 180 165T440 180M-40 180Q100 80 180 185T440 200M-40 200Q100 100 180 205T440 220M-40 220Q100 120 180 225T440 240"/></g><path d="M290-20Q200 70 275 150T230 380" stroke="#b9d5d7" stroke-width="34" fill="none"/><path d="M-20 275Q110 180 165 240T420 265M50-10Q80 110 150 160T210 390" stroke="#fafaf4" stroke-width="10" fill="none"/><g fill="#64765b" font-size="12"><text x="35" y="84">青山步道</text><text x="286" y="208">映月湖</text><text x="40" y="315">林间入口</text></g>${reference?'<path d="M82 276L108 232L96 189L152 160L168 100L235 78L278 124L247 173L215 220" fill="none" stroke="#7450a2" stroke-width="4" stroke-dasharray="8 6"/>':''}${recording!=='idle'||mini?'<path d="M82 276L108 232L96 189L152 160L168 118L196 108" fill="none" stroke="#fff" stroke-width="8"/><path d="M82 276L108 232L96 189L152 160L168 118L196 108" fill="none" stroke="#17634b" stroke-width="4" stroke-linejoin="round"/><circle cx="82" cy="276" r="7" fill="#fff" stroke="#17634b" stroke-width="3"/>':''}<circle cx="196" cy="108" r="16" fill="#17634b" opacity=".12"/><circle cx="196" cy="108" r="6" fill="#17634b" stroke="#fff" stroke-width="3"/></svg><div class="map-tag">${recording==='paused'?'Ⅱ 已暂停':'● 定位良好 · ±8 m'} · 示例</div><span class="map-label">示意底图 · 非真实地理数据</span>${mini?'':'<button class="locate" id="locate" aria-label="定位到我">⌖</button>'}</div>`;}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2800);}
function go(p){page=p;render();}
function bind(id,fn){const el=document.getElementById(id);if(el)el.onclick=fn;}
function render(){document.getElementById('mapNav').classList.toggle('selected',page==='map');document.getElementById('listNav').classList.toggle('selected',page==='list'||page==='detail');header.innerHTML=page==='map'?'<span class="brand">山径<span class="small"> / TRAIL</span></span><button id="settings" aria-label="设置">⚙</button>':`<button class="back" id="back" aria-label="返回">←</button><h2>${({list:'我的轨迹',detail:'轨迹详情',import:'导入 GPX',settings:'设置'})[page]}</h2><span style="width:40px"></span>`;bind('settings',()=>go('settings'));bind('back',()=>go(page==='detail'||page==='import'?'list':'map'));
if(page==='map'){screen.innerHTML=mapMarkup()+`<section class="sheet"><div class="handle"></div><div class="row"><span class="small">${recording==='idle'?'准备出发':recording==='paused'?'已暂停 · 数据已保存':'● 正在记录 · 示例数据'}</span><select id="mode" aria-label="运动类型" ${recording!=='idle'?'disabled':''}>${['徒步','跑步','骑行','步行'].map(x=>`<option ${mode===x?'selected':''}>${x}</option>`).join('')}</select></div>${reference?'<p class="legend">┄ 参考路线已加载 · 紫色虚线</p>':''}<div class="hero">${recording==='idle'?'0.00':'2.48'} <span class="unit">公里</span></div><div class="metrics"><div><div class="small">有效时长</div><div class="value">${recording==='idle'?'00:00:00':'00:38:12'}</div></div><div><div class="small">${mode==='跑步'?'平均配速 / 分每公里':'平均速度 / km/h'}</div><div class="value">${recording==='idle'?'—':mode==='跑步'?'15′24″':'3.9'}</div></div></div>${recording==='paused'?'<div class="row"><button class="primary" id="resume">继续记录</button><button class="danger" id="finish">结束</button></div>':`<button class="primary" id="record">${recording==='idle'?'开始记录':'暂停记录'}</button>`}${recording==='idle'?'<button class="secondary" id="import">＋ 导入 GPX 路线</button>':''}</section>`;bind('record',()=>{recording=recording==='idle'?'recording':'paused';render();});bind('resume',()=>{recording='recording';render();});bind('finish',()=>document.getElementById('finishDialog').showModal());bind('import',()=>go('import'));bind('locate',()=>toast('已回到示意位置'));document.getElementById('mode').onchange=e=>{mode=e.target.value;render();};}
if(page==='list'){screen.innerHTML=`<div class="content"><div class="row"><span class="small">${tracks.length} 条轨迹 · 保存在本机</span><button id="import">＋ 导入</button></div><input id="search" placeholder="搜索轨迹名称" aria-label="搜索轨迹" value="${escapeText(query)}"><div class="tabs">${['全部','已记录','已导入'].map(x=>`<button data-filter="${x}" class="${filter===x?'selected':''}">${x}</button>`).join('')}</div><div id="results"></div>${recording!=='idle'?'<button class="primary" id="returnRecord">返回当前记录</button>':''}</div>`;bind('import',()=>go('import'));bind('returnRecord',()=>go('map'));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();});document.getElementById('search').oninput=e=>{query=e.target.value;results();};results();}
if(page==='detail'){const t=tracks[selected];screen.innerHTML=mapMarkup(true)+`<div class="content"><h2>${escapeText(t.name)}</h2><p class="small">${t.source} · ${t.date}</p><div class="hero">${t.distance} <span class="unit">公里</span></div><div class="metrics"><div><div class="small">${t.source==='已导入'?'总历时':'有效时长'}</div><div class="value">${t.duration}</div></div><div><div class="small">累计爬升 / 米</div><div class="value">${t.ascent}</div></div></div>${t.source==='已导入'?'<div class="notice">示例文件缺少时间与海拔，这些数据保持为空。</div>':''}<button class="primary" id="load">加载到地图</button><button class="secondary" id="export">↑ 导出 GPX</button></div>`;bind('load',()=>{reference=true;go('map');toast('参考路线已加载，当前记录保持独立');});bind('export',()=>toast('设计预览：正式版将打开系统保存位置选择器'));}
if(page==='import'){screen.innerHTML='<div class="content"><div class="notice">原型使用示例文件。正式版通过系统文件选择器打开 GPX。</div><div class="card"><strong>周末山脊.gpx</strong><p class="small">GPX 1.1 · 示例预览</p><h2>山脊步道</h2><p>1 条轨迹 · 2 个分段<br>486 个轨迹点 · 12.80 公里</p></div><div class="notice">缺少时间、海拔：可查看和加载路线，时长与爬升显示「—」。</div><button class="primary" id="saveImport">保存示例轨迹</button><button class="secondary" id="cancelImport">取消</button></div>';bind('cancelImport',()=>go('list'));bind('saveImport',()=>{tracks.push({name:'周末山脊',distance:'12.80',duration:'—',ascent:'—',source:'已导入',date:'GPX · 2 个分段'});selected=tracks.length-1;go('detail');});}
if(page==='settings'){screen.innerHTML='<div class="content"><div class="card"><strong>记录精度</strong><select aria-label="记录精度" id="accuracy"><option>均衡 · 默认</option><option>精细</option><option>省电</option></select><p class="small">此原型仅展示设置，不影响模拟数据。</p></div><div class="card"><strong>单位</strong><span>公里 · 米</span></div><div class="card"><strong>地图与存储</strong><p class="small">轨迹保存在本机<br>底图来源在工程阶段验证<br>离线区域下载将在后续阶段加入</p></div><p class="small">山径 · 阶段 0<br>无需登录 · GPX 优先<br>无广告 · 无商城</p></div>';document.getElementById('accuracy').onchange=()=>toast('已预览该选项，尚未连接定位服务');}}
function results(){const items=tracks.map((t,i)=>({t,i})).filter(({t})=>(filter==='全部'||t.source===filter)&&t.name.includes(query));document.getElementById('results').innerHTML=items.length?items.map(({t,i})=>`<button class="card" data-track="${i}"><strong>${escapeText(t.name)}</strong><div class="row"><span class="small">${t.date}</span><span>${t.distance} km</span></div><span class="small">${t.source}</span></button>`).join(''):'<p>没有匹配的轨迹，试试其他名称。</p>';document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.track);go('detail');});}
document.getElementById('mapNav').onclick=()=>go('map');document.getElementById('listNav').onclick=()=>go('list');document.getElementById('cancelFinish').onclick=()=>document.getElementById('finishDialog').close();document.getElementById('confirmFinish').onclick=()=>{document.getElementById('finishDialog').close();tracks.unshift({name:'今天的'+mode,distance:'2.48',duration:'00:38:12',ascent:'42',source:'已记录',date:'刚刚 · '+mode});selected=0;recording='idle';go('detail');toast('示例记录已保存');};render();
</script></body></html>
